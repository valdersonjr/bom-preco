name: Manter o banco ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Uma consulta por dia basta para o contador nunca chegar lá, e sobra folga
# para as execuções agendadas que o GitHub atrasa ou pula.
on:
  schedule:
    - cron: '17 9 * * *' # 06:17 em Goianésia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # O papel anônimo não lê nada do esquema, então a resposta esperada é
      # uma recusa do Postgres — que só existe se a consulta chegou ao banco.
      # Qualquer outra resposta derruba o job: 404, por exemplo, é a API de pé
      # sem ter falado com o banco.
      - name: Consultar a API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/preco_publico?select=produto_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
          echo "HTTP $codigo"
          [ "$codigo" = "401" ] || [ "$codigo" = "200" ]
